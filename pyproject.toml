[project]
name = "kospi-mini-sts"
version = "0.1.0"
description = "Redis Streams 기반 실시간 트레이딩 시스템"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "redis>=5.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "websockets>=12.0",
    "pycryptodome>=3.19.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "sqlalchemy>=2.0.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
]
db = [
    "clickhouse-connect>=0.7.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
all = [
    "kospi-mini-sts[ml,db,dev]",
]

[project.scripts]
collector = "src.collector.data_collector:main"
processor = "src.processor.feature_processor:main"
db-logger = "src.db_logger.db_logger:main"
prediction = "src.prediction.prediction_engine:main"
strategy = "src.strategy.strategy_manager:main"
sts = "src.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "config"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
pythonpath = ["."]
