# Prometheus Configuration
# KOSPI Mini Trading System Monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Redis metrics (via redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'redis'

  # ClickHouse metrics
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:8123']
    metrics_path: /metrics

  # Trading Application Metrics
  - job_name: 'tick-collector'
    static_configs:
      - targets: ['tick-collector:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'tick-collector'

  - job_name: 'feature-processor'
    static_configs:
      - targets: ['feature-processor:8081']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'feature-processor'

  - job_name: 'strategy-manager'
    static_configs:
      - targets: ['strategy-manager:8082']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'strategy-manager'
