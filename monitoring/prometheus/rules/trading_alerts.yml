# Trading System Alert Rules
groups:
  - name: trading_alerts
    rules:
      # 컴포넌트 다운 알림
      - alert: ComponentDown
        expr: component_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Trading component {{ $labels.component }} is down"
          description: "Component {{ $labels.component }} has been down for more than 1 minute."

      # 일일 손실 초과 알림
      - alert: DailyLossExceeded
        expr: daily_pnl < -1000000
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Daily loss exceeded threshold"
          description: "Daily P&L is {{ $value }} KRW, exceeding the -1,000,000 threshold."

      # 포지션 손실 알림
      - alert: PositionLossAlert
        expr: position_pnl < -500000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Position loss exceeded threshold"
          description: "Position P&L for {{ $labels.strategy }} on {{ $labels.symbol }} is {{ $value }} KRW."

      # API 에러 급증 알림
      - alert: HighAPIErrorRate
        expr: rate(api_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High API error rate detected"
          description: "API {{ $labels.api }} is experiencing {{ $value }} errors per second."

      # Redis 지연 알림
      - alert: RedisLagHigh
        expr: redis_lag_seconds > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Redis stream lag is high"
          description: "Stream {{ $labels.stream }} has {{ $value }}s lag."

      # WebSocket 연결 끊김
      - alert: WebSocketDisconnected
        expr: websocket_connected == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "WebSocket disconnected"
          description: "WebSocket connection to {{ $labels.endpoint }} is down."

      # 틱 데이터 수신 중단
      - alert: NoTickDataReceived
        expr: rate(tick_data_received_total[5m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No tick data received"
          description: "No tick data has been received for {{ $labels.symbol }} in the last 5 minutes."

      # ClickHouse 삽입 에러
      - alert: ClickHouseInsertErrors
        expr: rate(clickhouse_errors_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "ClickHouse insert errors detected"
          description: "Table {{ $labels.table }} is experiencing insert errors."

  # =========================================================================
  # Monitoring & Alerting System Rules (001-monitoring-alerting)
  # =========================================================================
  - name: monitoring_alerts
    rules:
      # Health Check Alerts
      - alert: ServiceDown
        expr: health_check_status == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.service }} is down"
          description: "Service {{ $labels.service }} has been down for more than 1 minute"

      - alert: ServiceDegraded
        expr: health_check_status == 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Service {{ $labels.service }} is degraded"
          description: "Service {{ $labels.service }} has been degraded for more than 5 minutes"

      # Anomaly Detection Alerts
      - alert: HighPriceVolatility
        expr: abs(price_volatility_zscore) > 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High price volatility detected for {{ $labels.symbol }}"
          description: "Z-score: {{ $value }}"

      - alert: AbnormalSignalFrequency
        expr: signal_frequency_ratio > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Abnormal signal frequency for {{ $labels.strategy }}"
          description: "Signal frequency is {{ $value }}x normal"

      - alert: LossStreak
        expr: loss_streak_count > 5
        labels:
          severity: warning
        annotations:
          summary: "Loss streak detected for {{ $labels.strategy }}"
          description: "{{ $value }} consecutive losses"

      # Alert Delivery Alerts
      - alert: AlertQueueBacklog
        expr: alerts_pending > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alert queue backlog"
          description: "{{ $value }} alerts pending in queue"

      - alert: HighAlertFailureRate
        expr: rate(alerts_sent_total{status="failed"}[5m]) > 0.1
        labels:
          severity: warning
        annotations:
          summary: "High alert failure rate"
          description: "Alert delivery failure rate is high"

      # Performance Alerts
      - alert: HighDrawdown
        expr: strategy_max_drawdown > 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High drawdown for {{ $labels.strategy }}"
          description: "Max drawdown is {{ $value | humanizePercentage }}"

      - alert: CriticalDrawdown
        expr: strategy_max_drawdown > 0.25
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical drawdown for {{ $labels.strategy }}"
          description: "Max drawdown is {{ $value | humanizePercentage }} - Consider stopping strategy"
