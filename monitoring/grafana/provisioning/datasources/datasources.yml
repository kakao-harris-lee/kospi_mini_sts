# Grafana Datasource Configuration
apiVersion: 1

# Delete existing datasources to re-provision with correct UIDs
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: ClickHouse
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    url: http://host.docker.internal:8123
    jsonData:
      defaultDatabase: kospi
      port: 8123
      protocol: http
      username: default
    secureJsonData:
      password: "@1tidh6ls6ls"
    editable: false
